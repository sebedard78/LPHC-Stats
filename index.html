<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loon Pond Stat Master Cloud</title>
    <!-- 1. PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0ea5e9">
    <link class="rounded-none" rel="apple-touch-icon" href="logo.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Condensed:wght@400;700&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0 !important; }
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; overflow-x: hidden; }

    /* FULLSCREEN HIDE HEADER/NAV */
    :fullscreen header, :fullscreen nav { display: none !important; }
    :-webkit-full-screen header, :-webkit-full-screen nav { display: none !important; }
    :fullscreen .sticky-scorer { top: 0 !important; }

    .tab-active { border-bottom: 4px solid #0ea5e9; color: #0ea5e9; font-weight: 900; }
    .mode-btn-active { background-color: #0ea5e9 !important; color: white !important; font-weight: 900; }

    /* SCORER TABLES - FIXED WIDTH FOR MOBILE FIT */
    .scorer-max-width { max-width: 900px; margin: 0 auto; width: 100%; }
    
    .micro-container { 
        width: 100%; 
        background: #000; 
        border-top: 1px solid #333;
        height: calc(100vh - 540px);
        overflow-y: auto;
    }
    .micro-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-family: 'Roboto Condensed', sans-serif; }
    .micro-table th { 
        font-size: 0.5rem;
        padding: 8px 0; 
        color: #7dd3fc; 
        background: #111; 
        border: 0.5px solid #222; 
        text-transform: uppercase;
    }
    .micro-table td { font-size: 1.1rem; padding: 12px 0; text-align: center; border: 0.5px solid #1a1a1a; color: #fff; line-height: 1; }
    
    /* SCORER COLUMN WIDTH PERCENTAGES (Total = 100%) */
    .c-sh { width: 8% !important; font-weight: 900; color: #0ea5e9 !important; border-right: 1.5px solid #0ea5e9 !important; background: #000; position: sticky; left: 0; z-index: 10; }
    .c-r { width: 5% !important; color: #38bdf8; font-weight: bold; font-size: 0.6rem !important; } 
    .c-p { width: 5% !important; font-weight: bold; color: #facc15; } 
    .c-s { width: 6% !important; font-weight: bold; color: #fff; opacity: 0.5; }
    /* T1 and T2 - Highlight Removed */
    .c-t { width: 13.5% !important; background: #000 !important; color: #fff !important; font-weight: 900; font-size: 1.1rem !important; border-left: 1px solid #333 !important; border-right: 1px solid #333 !important; }
    .c-t2 { width: 13.5% !important; background: #000 !important; color: #0ea5e9 !important; font-weight: 900; font-size: 1.1rem !important; border-left: 1px solid #333 !important; }

    .edit-cell { color: #fcd34d !important; font-weight: 900; cursor: pointer; }
    .curr-row { background: #171717; outline: 1px solid #444; }

    /* PITCHING HIGHLIGHT */
    .slot-selected { border: 6px solid #0ea5e9 !important; background: #e0f2fe !important; }
    .slot-filled { opacity: 0.4; pointer-events: none; }

    /* DATA TABLES */
    .std-table { width: 100%; border-collapse: collapse; table-layout: fixed; background: #000; color: #fff; }
    .std-table th { background: #1a1a1a; color: #7dd3fc; font-size: 0.55rem; padding: 12px 1px; border: 1px solid #333; text-transform: uppercase; }
    .std-table td { border-bottom: 1px solid #222; padding: 12px 1px; text-align: center; font-size: 0.95rem; font-weight: bold; vertical-align: middle; }

    .stats-name-col { width: 160px; min-width: 160px; text-align: left !important; padding-left: 15px !important; border-right: 3px solid #0ea5e9 !important; text-transform: uppercase; position: sticky; left: 0; background: #000; z-index: 10; color: #fff !important; font-size: 0.9rem !important; white-space: normal !important; overflow-wrap: break-word; line-height: 1.2; }
    .st-name-col { width: 52%; text-align: left !important; padding-left: 10px !important; border-right: 3px solid #0ea5e9 !important; text-transform: uppercase; color: #fff !important; white-space: normal !important; overflow-wrap: break-word; line-height: 1.2; }
    .st-num-col { width: 9%; color: #fff; }
    .pts-col { width: 12%; background: #0a0a0a; color: #0ea5e9 !important; font-size: 1.1rem !important; }

    .sum-stats-table { width: 100%; border-collapse: collapse; table-layout: auto; background: #000; color: #fff; }
    .sum-stats-table th { background: #1a1a1a; color: #7dd3fc; font-size: 0.65rem; padding: 12px 10px; border: 1px solid #333; text-transform: uppercase; text-align: left; }
    .sum-stats-table td { border-bottom: 1px solid #222; padding: 12px 10px; text-align: left; font-size: 0.95rem; font-weight: bold; vertical-align: middle; white-space: normal !important; overflow-wrap: break-word; }
    .sum-stats-table .val-col { text-align: center; background: #0a0a0a; color: #0ea5e9; width: 60px; border-left: 1px solid #333; font-size: 1.1rem; }

    /* WEEKLY LINEUP TABLE STYLING */
    .lineup-table { width: 100%; border-collapse: collapse; background: white; border: 4px solid #000; margin-top: 10px; table-layout: fixed; }
    .lineup-header-bg { background-color: #0ea5e9 !important; color: #000 !important; }
    .lineup-table th { padding: 15px; font-weight: 900; font-size: 1.4rem; border-bottom: 4px solid #000; text-align: center; text-transform: uppercase; font-style: italic; }
    
    .lineup-table th.lineup-court-col { font-size: 1rem !important; padding: 5px 2px; }

    .lineup-table td { padding: 12px; border: 1px solid #e2e8f0; font-weight: 800; text-align: center; font-size: 1.1rem; color: #1e293b; overflow-wrap: break-word; vertical-align: middle; }
    .lineup-row-even { background-color: #f8fafc; }
    .lineup-row-odd { background-color: #ffffff; }
    .lineup-matchup-col { text-align: center !important; line-height: 1.4; white-space: pre-line; letter-spacing: -0.5px; }
    .lineup-court-col { width: 80px; background: #1e293b; color: #38bdf8 !important; border-right: 4px solid #000 !important; font-size: 1.5rem; font-weight: 900; }

    #printZone { display: none; }

    @media print {
        @page { margin: 1cm; size: portrait; }
        .no-print, header, nav, main, #exitModal, button { display: none !important; }
        body { background: white !important; color: black !important; overflow: visible !important; }
        #printZone { display: block !important; position: absolute; top: 0; left: 0; width: 100%; z-index: 99999; background: white !important; }
        #printZone * { position: static !important; overflow: visible !important; color: black !important; background: transparent !important; border-color: black !important; border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }
        .std-table, .sum-stats-table { width: 100% !important; border: 1px solid black !important; border-collapse: collapse !important; table-layout: fixed !important; margin-bottom: 20px !important; }
        .std-table th, .std-table td, .sum-stats-table th, .sum-stats-table td { border: 1px solid black !important; padding: 6px 3px !important; font-size: 11pt !important; color: black !important; line-height: 1.2 !important; }
        .stats-name-col { width: 25% !important; border-right: 1px solid black !important; text-align: left !important; padding-left: 6px !important; font-size: 10pt !important; }
        .pts-col, .val-col { background: #f0f0f0 !important; font-weight: bold !important; border-left: 1px solid black !important; }
        .grid { display: flex !important; gap: 10px !important; align-items: flex-start !important; }
        .grid > div { flex: 1 !important; }
        .lineup-table { width: 100% !important; border: 2px solid black !important; box-shadow: none !important; }
        .lineup-header-bg { background-color: #0ea5e9 !important; -webkit-print-color-adjust: exact; }
        .lineup-court-col { background-color: #eee !important; color: black !important; border-right: 2px solid black !important; }
    }

    .btn-score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; background: #000; }
    .btn-score { background: white; border-bottom: 4px solid #cbd5e1; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn-score .num { font-size: 2.2rem; font-weight: 900; color: #111; line-height: 1; }
    .btn-score .sym { font-size: 0.7rem; color: #94a3b8; font-weight: bold; }

    /* BUTTON SCORER STYLES */
    .manual-entry-btn { background: white; border: 2px solid #e2e8f0; height: 44px; width: 100%; font-weight: 900; display: flex; align-items: center; justify-content: center; color: #000; border-radius: 6px !important; transition: background 0.2s; }
    .manual-entry-btn.active { border-color: #0ea5e9; background: #f0f9ff; }

    .sum-row-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 10px; }
    .sum-row-table th { color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding: 5px; font-size: 8px; text-align: center; }
    .sum-row-table td { padding: 10px 2px; border-bottom: 1px solid #f1f5f9; font-weight: 900; text-align: center; vertical-align: middle; }

    /* CUSTOM DIALOG STYLES */
    #customDialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    .dialog-box { background: #18181b; border: 2px solid #3f3f46; width: 100%; max-width: 400px; padding: 24px; color: white; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

    /* LANDSCAPE SPECIFIC ADJUSTMENTS */
    @media (orientation: landscape) {
        .sticky-scorer { position: relative !important; top: 0 !important; width: 100% !important; max-width: none !important; }
        
        .micro-container { height: auto !important; min-height: 250px; overflow-y: visible !important; }
        .micro-table td { font-size: 1.6rem !important; padding: 15px 0 !important; }
        .micro-table th { font-size: 0.8rem !important; }
        
        .t-micro-container { height: auto !important; min-height: 200px; }
        .t-micro-table td { font-size: 1.4rem !important; padding: 12px 0 !important; }
        .t-micro-table th { font-size: 0.7rem !important; }

        .sum-row-table { font-size: 1.4rem !important; }
        .sum-row-table th { font-size: 1rem !important; }
        .sum-row-table td { font-size: 1.4rem !important; padding: 15px 5px !important; }

        .btn-score-grid { grid-template-columns: repeat(6, 1fr) !important; padding: 5px !important; }
        .btn-score { height: 90px !important; background: #fff !important; }
        .btn-score .num { font-size: 3rem !important; }
        .btn-score .sym { display: block; font-size: 0.8rem; }
        .sticky-scorer .text-8xl { font-size: 12rem !important; line-height: 0.8 !important; }
        .sticky-scorer .py-4 { padding: 1.5rem !important; }
        .sticky-scorer .text-[12px] { font-size: 1.2rem !important; }
        .sticky-scorer .text-[11px] { font-size: 1rem !important; }
        
        .sticky-scorer button[onclick*="setScoringSlot"] { font-size: 1.8rem !important; padding: 12px 20px !important; }

        .t-btn-score-grid { grid-template-columns: repeat(6, 1fr) !important; padding: 8px !important; }
        .t-btn-score { height: 100px !important; }
        .t-btn-score .num { font-size: 3rem !important; }
        .c-t, .c-t2 { width: 15% !important; }
    }

    /* REPORT STYLES */
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 5px; background: white; color: black; }
    .report-card { border: 1px solid #ccc; font-family: 'Roboto Condensed', sans-serif; }
    .report-header { background: #f3f4f6; padding: 4px; border-bottom: 1px solid #ccc; font-weight: bold; text-align: center; text-transform: uppercase; font-size: 12px; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .report-table td { border: 1px solid #eee; padding: 4px; }
    .report-table tr td:nth-child(2) { text-align: center; width: 40px; font-weight: bold; }
    .report-table tr td:nth-child(1) { width: 40px; color: #666; text-align: center; }

<div id="printZone"></div>
<div id="modal"></div>
<div id="customDialog"></div>

<div id="exitModal" class="fixed inset-0 bg-black/95 z-[999] items-center justify-center p-6 text-white no-print" style="display:none;">
    <div class="bg-zinc-900 border-2 border-zinc-700 w-[90%] max-w-md p-8 shadow-2xl text-center text-white">
        <h2 class="text-2xl font-black italic uppercase text-sky-400 mb-2">Exit Match?</h2>
        <div class="space-y-4 mt-6 text-white">
            <button onclick="window.confirmExit('SUBMIT')" class="w-full bg-sky-500 text-black p-5 font-black uppercase text-sm">Submit & Save Results</button>
            <button onclick="window.confirmExit('DISCARD')" class="w-full bg-red-600 text-white p-5 font-black uppercase text-sm">Discard & Delete Series</button>
            <button onclick="window.closeExitModal()" class="w-full bg-zinc-800 text-white p-4 font-bold uppercase text-xs">Back to Match</button>
        </div>
    </div>
</div>

<header class="bg-black text-white p-4 shadow-2xl flex justify-between items-center border-b-4 border-sky-500 no-print">
    <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Logo" class="w-10 h-10 object-contain">
        <h1 class="text-xl font-black italic uppercase tracking-tighter text-white">Loon Pond Stat Master</h1>
    </div>
    <div id="leagueModes" class="flex gap-1 bg-zinc-900 p-1 text-white">
        <button id="modeS" onclick="window.setMode('SINGLES')" class="text-[10px] px-4 py-2 transition font-bold uppercase">Singles</button>
        <button id="modeD" onclick="window.setMode('DOUBLES')" class="text-[10px] px-4 py-2 transition font-bold uppercase">Doubles</button>
    </div>
</header>

<nav id="navBar" class="flex bg-white shadow-sm sticky top-0 z-50 overflow-x-auto border-b no-print">
    <button onclick="window.setTab('NEWS')" id="tabNEWS" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">News</button>
    <button onclick="window.setTab('EVENTS')" id="tabEVENTS" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">Events</button>
    <button onclick="window.setTab('STANDINGS')" id="tabSTANDINGS" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">Standings</button>
    <button onclick="window.setTab('STATS')" id="tabSTATS" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">Club Stats</button>
    <button onclick="window.setTab('LINEUP')" id="tabLINEUP" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">Lineup</button>
    <button onclick="window.setTab('REPORT')" id="tabREPORT" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">Report</button>
    <button onclick="window.setTab('SCORER')" id="tabSCORER" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-red-500 text-nowrap">Scorer</button>
    <button onclick="window.setTab('HISTORY')" id="tabHISTORY" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">History</button>
    <button onclick="window.setTab('NHPA')" id="tabNHPA" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">NHPA</button>
    <button onclick="window.setTab('TOURNAMENT')" id="tabTOURNAMENT" class="flex-1 min-w-[100px] py-4 text-[9px] font-black uppercase tracking-widest text-gray-400 text-nowrap">Tournament</button>
    <button onclick="window.setTab('MANAGE')" id="tabMANAGE" class="flex-1 min-w-[80px] py-4 text-[9px] font-black uppercase tracking-widest text-nowrap">Manage</button>
</nav>

    function normalizeLoadedState(incoming) {
        state = incoming || state;
        if(!state.roster) state.roster = { SINGLES: [], DOUBLES: [] };
        if(!state.roster.SINGLES) state.roster.SINGLES = [];
        if(!state.roster.DOUBLES) state.roster.DOUBLES = [];
        if(!state.history) state.history = [];
        if(!state.sessions) state.sessions = [];
        if(!state.managePin) state.managePin = '1234';
        if(!state.nhpa) state.nhpa = {SINGLES:{}, DOUBLES:{}};
        if(!state.hcpLocked) state.hcpLocked = {SINGLES:true, DOUBLES:true};
        if(!state.playoffHcpLocked) state.playoffHcpLocked = {SINGLES:false, DOUBLES:false};
        if(!state.playoffHcp) state.playoffHcp = {SINGLES:{}, DOUBLES:{}};
        if(!state.playoffHcp.SINGLES) state.playoffHcp.SINGLES = {};
        if(!state.playoffHcp.DOUBLES) state.playoffHcp.DOUBLES = {};
        if(state.manualEntryEnabled === undefined) state.manualEntryEnabled = true;
        if(!state.weeklyHoa) state.weeklyHoa = { SINGLES: [], DOUBLES: [] };
        if(!state.fourDeads || Array.isArray(state.fourDeads)) state.fourDeads = { SINGLES: {}, DOUBLES: {} };

        if(Array.isArray(state.fourDeads.DOUBLES)) state.fourDeads.DOUBLES = {};
        if(state.news === undefined) state.news = '';

        if(state.reportEnabled === undefined) state.reportEnabled = true;
        if(state.historyEnabled === undefined) state.historyEnabled = true;
        if(state.nhpaEnabled === undefined) state.nhpaEnabled = true;
        if(!state.winners) state.winners = {champ:'', runner:'', season:''};
        if(!state.activeMatches) state.activeMatches = [];
        if(!state.tournament) state.tournament = { SINGLES:{participants:[],matches:[],activeId:null,complete:false}, DOUBLES:{participants:[],matches:[],activeId:null,complete:false} };
        if(!state.tournament.SINGLES) state.tournament.SINGLES = {participants:[],matches:[],activeId:null,complete:false};
        if(!state.tournament.DOUBLES) state.tournament.DOUBLES = {participants:[],matches:[],activeId:null,complete:false};
        if(!state.roundRobin) state.roundRobin = {SINGLES:{weeks:[],positionRound:false,halfPositionRound:false,doubleRoundRobin:false,requestedWeeks:0,updatedAt:0},DOUBLES:{weeks:[],positionRound:false,halfPositionRound:false,doubleRoundRobin:false,requestedWeeks:0,updatedAt:0}};
        if(!state.roundRobin.SINGLES) state.roundRobin.SINGLES = {weeks:[],positionRound:false,halfPositionRound:false,requestedWeeks:0,updatedAt:0};
        if(!state.roundRobin.DOUBLES) state.roundRobin.DOUBLES = {weeks:[],positionRound:false,halfPositionRound:false,requestedWeeks:0,updatedAt:0};
        if(!Array.isArray(state.roundRobin.SINGLES.weeks)) state.roundRobin.SINGLES.weeks = [];
        if(!Array.isArray(state.roundRobin.DOUBLES.weeks)) state.roundRobin.DOUBLES.weeks = [];
        if(state.roundRobin.SINGLES.halfPositionRound===undefined) state.roundRobin.SINGLES.halfPositionRound=false;
        if(state.roundRobin.DOUBLES.halfPositionRound===undefined) state.roundRobin.DOUBLES.halfPositionRound=false;
        if(state.roundRobin.SINGLES.requestedWeeks===undefined) state.roundRobin.SINGLES.requestedWeeks=0;
        if(state.roundRobin.DOUBLES.requestedWeeks===undefined) state.roundRobin.DOUBLES.requestedWeeks=0;
        if(!state.weeklyLineup || typeof state.weeklyLineup.rawPaste === 'string') {
            const oldRaw = state.weeklyLineup?.rawPaste || '';
            const oldTitle = state.weeklyLineup?.weekTitle || 'Week 1';
            state.weeklyLineup = { 
                SINGLES: { weekTitle: 'Singles ' + oldTitle, rawPaste: '' }, 
                DOUBLES: { weekTitle: 'Doubles ' + oldTitle, rawPaste: oldRaw }

    async function initFirebase() {
        try {
            const firebaseApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
            const firestore = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
            const app = firebaseApp.initializeApp(firebaseConfig);
            db = firestore.getFirestore(app);
            docRef = firestore.doc(db, "league", "masterData");
            firebaseSetDoc = firestore.setDoc;
            firebaseReady = true;

            firestore.onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const incoming = snapshot.data();
                    const localRR = state && state.roundRobin;
                    normalizeLoadedState(incoming);
                    // A Round Robin generation is local work until its write has completed.
                    // Do not let an older Firestore snapshot wipe it out.
                    if (roundRobinDirty && localRR) state.roundRobin = localRR;
                    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
                    render();
                }
            }, (error) => {
                console.error('Firebase listener error:', error);
            });
        } catch (error) {
            console.error('Firebase startup error:', error);
        }
    }

    async function save() {
        if (!firebaseReady || !docRef || !firebaseSetDoc) {
            await window.smAlert('Cloud connection is not ready yet. Please wait a moment and try again.');
            return;
        }
        await firebaseSetDoc(docRef, state);
    }

    const cleanN = (n) => n ? n.toLowerCase().trim().replace(/[^a-z0-9]/g, '') : '';
    const getSym = (pts, oppPts = 0) => { 
        if(pts===null||pts===undefined) return '--'; 
        if(Number(pts) === 6 && Number(oppPts) === 6) return 'XX';
        if(pts>=6) return 'OO'; if(pts===4) return "O'"; if(pts===3) return 'O'; return '--'; 
    };
    const getR = (pts) => pts>=6?2:(pts>=3?1:0);

    const getFirst = (n) => {
        if(!n) return '---';
        if(n.includes(',')) return n.split(',')[1].trim().split(' ')[0];
        return n.split(' ')[0];
    };

    function getPlyrAvg(pName) {
        const n = cleanN(pName); if(!pName || ['bye','dummy'].includes(n)) return 0;
        const rList = mode === 'SINGLES' ? (state.roster.SINGLES||[]) : (state.roster.DOUBLES.flatMap(t => t.members));
        const p = rList.find(x => cleanN(x.name) === n);
        const hist = (state.history || []).filter(x => cleanN(x.player) === n && x.mode === mode && !x.isNoShow).slice(-9);
        const rawAvg = hist.length ? hist.reduce((s, g) => s + g.score, 0) / hist.length : (p ? Number(p.startAvg) : 0);
        return Math.round(rawAvg);
    }

    function getPlyrAvgAtTimestamp(pName, timestamp) {
        const n = cleanN(pName); if(!pName || ['bye','dummy'].includes(n)) return 0;
        const rList = mode === 'SINGLES' ? (state.roster.SINGLES||[]) : (state.roster.DOUBLES.flatMap(t => t.members));
        const p = rList.find(x => cleanN(x.name) === n);
        
        if (!timestamp) return getPlyrAvg(pName);

        const hist = (state.history || [])
            .filter(x => cleanN(x.player) === n && x.mode === mode && !x.isNoShow && x.timestamp && x.timestamp < timestamp)
            .sort((a, b) => a.timestamp - b.timestamp)
            .slice(-9);
            
        const rawAvg = hist.length ? hist.reduce((s, g) => s + g.score, 0) / hist.length : (p ? Number(p.startAvg) : 0);
        return Math.round(rawAvg);
    }

    // Handicap source is deliberately centralized:
    // 1) If HCP is locked for the current league, use the roster's stored currentHcp.
    // 2) If HCP is not locked, calculate it from the same current average used by Stats.
    function getHandicapForPlayer(pName, modeName = mode) {
        const n = cleanN(pName);
        if(!pName || n === 'bye') return 0;
        if(n === 'dummy') return 54;

        const roster = modeName === 'SINGLES'
            ? (state.roster.SINGLES || [])
            : (state.roster.DOUBLES || []).flatMap(t => t.members || []);
        const p = roster.find(x => cleanN(x.name || x.teamName) === n);
        if(!p) return 0;

        const locked = !!(state.hcpLocked && state.hcpLocked[modeName]);
        if(locked) {
            // Locked handicap ALWAYS comes from the roster. Older roster records may
            // use `hcp`, while current records use `currentHcp`, so support both.
            const rosterHcp = p.currentHcp !== undefined && p.currentHcp !== null
                ? p.currentHcp
                : (p.hcp !== undefined && p.hcp !== null ? p.hcp : 0);
            return Number(rosterHcp) || 0;
        }

        // Auto handicap uses the player's current Stats average (last 9 games),
        // then applies the league's existing handicap formula.
        // Use the same Stats-average routine used everywhere else so the handicap
        // cannot drift from the value shown in Stats.
        let avg;
        if (modeName === mode) {
            avg = getPlyrAvg(pName);
        } else {
            const hist = (state.history || [])
                .filter(x => cleanN(x.player) === n && x.mode === modeName && !x.isNoShow)
                .sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0))
                .slice(-9);
            avg = hist.length
                ? Math.round(hist.reduce((sum, g) => sum + Number(g.score || 0), 0) / hist.length)
                : Number(p.startAvg || 0);
        }
        const base = modeName === 'DOUBLES' ? 90 : 150;
        return Math.max(0, Math.floor((base - avg) * 0.9));
    }

    function getH(pName) {
        if (mode === 'SINGLES') return getSinglesHcp(pName, false);
        return getHandicapForPlayer(pName, mode);
    }

    function singlesNameKey(name) {
        const raw = String(name || '').trim().toLowerCase();
        if (!raw) return '';
        // Singles roster is commonly stored as LAST, FIRST while Lineup is
        // commonly FIRST LAST. Normalize both formats to the same token key.
        const parts = raw.includes(',')
            ? raw.split(',').map(x => x.trim()).filter(Boolean).reverse().join(' ')
            : raw;
        return parts.replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean).join(' ');
    }

    function singlesNameTokenKey(name) {
        return singlesNameKey(name).split(/\s+/).filter(Boolean).sort().join(' ');
    }

    function findSinglesRosterPlayer(pName) {
        const key = singlesNameKey(pName);
        const tokenKey = singlesNameTokenKey(pName);
        const roster = state.roster?.SINGLES || [];
        return roster.find(p => {
            const names = [p?.name, p?.teamName, p?.playerName, p?.fullName, p?.displayName];
            return names.some(v => {
                const k = singlesNameKey(v);
                return k && (k === key || singlesNameTokenKey(v) === tokenKey);
            });
        }) || null;
    }

    function getSinglesHcp(pName, playoff = false) {
        if (!pName) return 0;
        const n = cleanN(pName);
        if (n === 'bye' || n === 'dummy') return 0;

        // Always resolve the player from the actual Singles roster record.
        // The roster's Current Manual Handicap is the authoritative value for
        // Singles scoring. The HCP lock controls whether that value is frozen
        // for the league; it must not make the scorer lose the stored HCP.
        const player = findSinglesRosterPlayer(pName);
        if (!player) return 0;

        // Playoff snapshot has priority when a playoff HCP has been locked.
        if (playoff && state.playoffHcpLocked?.SINGLES) {
            const pm = state.playoffHcp?.SINGLES || {};
            const keys = [player.name, player.playerName, player.teamName, n].filter(Boolean);
            for (const k of keys) {
                const v = pm[cleanN(k)] ?? pm[k];
                if (v !== undefined && v !== null && v !== '') return Number(v) || 0;
            }
        }

        // Current stored Singles HCP is used whenever it exists, regardless of
        // whether the regular-season HCP toggle is currently Locked or Auto.
        // This fixes the scorer showing 0 even though Manage has a real HCP.
        const candidates = [
            player.currentHcp, player.hcp, player.handicap,
            player.manualHcp, player.currentHandicap, player.manualHandicap,
            player.HCP, player.Handicap, player.hcpValue
        ];
        for (const v of candidates) {
            if (v !== undefined && v !== null && v !== '' && Number.isFinite(Number(v))) {
                return Number(v);
            }
        }

        // Only fall back to the automatic calculation when the roster truly
        // has no handicap value at all.
        const hist = (state.history || [])
            .filter(x => cleanN(x.player) === cleanN(player.name || pName) && x.mode === 'SINGLES' && !x.isNoShow)
            .sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0))
            .slice(-9);
        const avg = hist.length
            ? Math.round(hist.reduce((sum, g) => sum + Number(g.score || 0), 0) / hist.length)
            : Number(player.startAvg || 0);
        return Math.max(0, Math.floor((150 - avg) * 0.9));
    }

    function getPlayoffHcp(pName) {
        const n = cleanN(pName);
        if(!pName || n === 'bye') return 0;
        if(n === 'dummy') return 54;
        if(state.playoffHcpLocked && state.playoffHcpLocked[mode] && state.playoffHcp && state.playoffHcp[mode] && state.playoffHcp[mode][n] !== undefined) return Number(state.playoffHcp[mode][n]) || 0;
        return getH(pName);
    }

    window.lockPlayoffHcp = async () => {
        if(!state.playoffHcpLocked) state.playoffHcpLocked = {SINGLES:false, DOUBLES:false};
        if(!state.playoffHcp) state.playoffHcp = {SINGLES:{}, DOUBLES:{}};
        if(state.playoffHcpLocked[mode]) {
            state.playoffHcpLocked[mode] = false;
            await save();
            await window.smAlert(`${mode} playoff handicaps unlocked. You can change the handicaps and lock them again when ready.`);
            render();
            return;
        }
        const roster = mode === 'SINGLES' ? (state.roster.SINGLES || []) : (state.roster.DOUBLES || []).flatMap(t => t.members || []);
        const snapshot = {};
        roster.forEach(p => { if(p && p.name) snapshot[cleanN(p.name)] = getH(p.name); });
        state.playoffHcp[mode] = snapshot;
        state.playoffHcpLocked[mode] = true;
        await save();
        await window.smAlert(`${mode} playoff handicaps locked. These values will be used for every playoff game until you unlock them.`);
        render();
    };

        const close = () => { dBox.style.display = 'none'; };
        const openManual = () => {

                agg1: game.s1, agg2: game.s2, fullData: [...match.games], timestamp: Date.now(), isPlayoff: true
            });
            state.activeMatches = state.activeMatches.filter(x => x.sessionId !== match.sessionId);
            match = { active: false, step: 'TEAMS', gameNum: 1, sessionId: null, t1Name: '', t2Name: '', p1: '', p2: '', p3: '', p4: '', h1: 0, h2: 0, h3: 0, h4: 0, games: [], pitcherIdx: 0, sessionAgg: { t1: 0, t2: 0 }, currGameFrames: [], currF: { p1: null, p2: null, p3: null, p4: null }, seriesBuffer: [], fourDeadLog: {}, isPlayoff: false, selectedSlot: null };
            view = 'STATS';
            await save();
            render();
            return;
        }

        let mW; const target = mode === 'SINGLES' ? 135 : 162;
        if (cleanN(match.t2Name) === 'bye') { const wins = match.games.filter(g => g.s1 >= target).length; mW = wins > 0 ? match.t1Name : 'BYE'; }
        else if (cleanN(match.t1Name) === 'bye') { const wins = match.games.filter(g => g.s2 >= target).length; mW = wins > 0 ? t2Name : 'BYE'; }
        else mW = match.sessionAgg.t1 > match.sessionAgg.t2 ? match.t1Name : (match.sessionAgg.t1 < match.t2Name ? match.t2Name : 'Tie');
        const today = new Date().toLocaleDateString(); 
        
        match.seriesBuffer.forEach(entry => {
            const pAvg = getPlyrAvg(entry.player); 
            const hoa = entry.score - pAvg;
            const idx = state.weeklyHoa[mode].findIndex(x => x.date === today);
            if (idx !== -1) { 
                if (hoa > state.weeklyHoa[mode][idx].hoa) {
                    state.weeklyHoa[mode][idx] = { date: today, player: entry.player, hoa: hoa }; 
                }
            } else {
                state.weeklyHoa[mode].push({ date: today, player: entry.player, hoa: hoa });
            }
        });

        state.history.push(...match.seriesBuffer);
        
        if(!state.fourDeads || Array.isArray(state.fourDeads)) state.fourDeads = { SINGLES: {}, DOUBLES: {} };
        if(!state.fourDeads[mode] || Array.isArray(state.fourDeads[mode])) state.fourDeads[mode] = {};
        
        Object.keys(match.fourDeadLog).forEach(p => { state.fourDeads[mode][p] = (state.fourDeads[mode][p] || 0) + match.fourDeadLog[p]; });

        state.sessions.push({ id: match.sessionId, name: `${match.t1Name} vs ${match.t2Name}`, t1Name: match.t1Name, t2Name: match.t2Name, date: today, mode, matchWinner: mW, agg1: match.sessionAgg.t1, agg2: match.sessionAgg.t2, fullData: [...match.games], timestamp: Date.now(), isPlayoff: match.isPlayoff });
        state.activeMatches = state.activeMatches.filter(x => x.sessionId !== match.sessionId);
        match = { active: false, step: 'TEAMS', gameNum: 1, sessionId: null, t1Name: '', t2Name: '', p1: '', p2: '', p3: '', p4: '', h1: 0, h2: 0, h3: 0, h4: 0, games: [], pitcherIdx: 0, sessionAgg: { t1: 0, t2: 0 }, currGameFrames: [], currF: { p1: null, p2: null, p3: null, p4: null }, seriesBuffer: [], fourDeadLog: {}, isPlayoff: false, selectedSlot: null };
        view = 'STANDINGS'; 
        await save(); 
        render();
    };

    /* MANUAL SCORER LOGIC */
    window.setScorerView = (v) => { scorerMode = v; render(); };
    window.toggleManualPlayoff = () => {
        if (!manualEntryState.isPlayoff && !(state.playoffHcpLocked && state.playoffHcpLocked[mode])) {
            return window.smAlert(`Lock the ${mode} playoff handicaps in Manage before entering playoff games.`);
        }
        manualEntryState.isPlayoff = !manualEntryState.isPlayoff;
        manualEntryState.shoes = mode === 'DOUBLES' ? 30 : 50;
        render();
    };
    window.updateManualShoes = (value) => {
        const n = Math.max(1, Number(value) || (mode === 'DOUBLES' ? 30 : 50));
        manualEntryState.shoes = n;
        const el = document.getElementById('mShoes');
        if (el && Number(el.value) !== n) el.value = n;
    };
    window.updateManualBonus = (teamNum, value) => {
        if (!manualEntryState.isPlayoff) return;
        const n = Number(value);
        manualEntryState['bonus' + teamNum] = Number.isFinite(n) ? n : 0;
    };

    window.updateManualHcp = (pNum) => { 
        const pName = document.getElementById('mp'+pNum).value; 
        if (manualEntryState.isPlayoff && !(state.playoffHcpLocked && state.playoffHcpLocked[mode])) return;
        const isDummy = cleanN(pName) === 'dummy';
        if (manualEntryState.isPlayoff && isDummy) {
            const existing = manualEntryState['mh'+pNum];
            const hcp = existing !== undefined && existing !== '' ? Number(existing) : 54;
            manualEntryState['mh'+pNum] = hcp;
            const hEl = document.getElementById('mh'+pNum);
            if (hEl) { hEl.value = hcp; hEl.readOnly = false; }
            return;
        }
        const hcp = manualEntryState.isPlayoff ? getPlayoffHcp(pName) : getH(pName);
        manualEntryState['mh'+pNum] = hcp;
        document.getElementById('mh'+pNum).value = hcp; 
    };
    window.updateManualHcpValue = (pNum, value) => {
        if (!manualEntryState.isPlayoff) return;
        const pName = document.getElementById('mp'+pNum)?.value || '';
        if (cleanN(pName) !== 'dummy') return;
        manualEntryState['mh'+pNum] = Number(value) || 0;
    };

    window.updateManualNumberField = (id, value) => {
        if (value === '') { delete manualEntryState[id]; return; }
        manualEntryState[id] = Number(value);
    };
    window.clearManualNumberField = (id) => {
        manualEntryState[id] = null;
        const el = document.getElementById(id);
        if (el) el.value = '';
    };

    window.openManualPicker = async (id, label) => {
        const result = await window.smKeypad("Enter " + label);
        if (result !== null) {
            manualEntryState[id] = result === "NP" ? null : Number(result);
            const btn = document.getElementById(id);
            if (!btn) return;
            if (result === "NP") {
                btn.innerText = label.toLowerCase().includes("ringer") ? "RNG: ---" : "SCR: ---";
                delete btn.dataset.value;
                btn.classList.remove('active');
            } else {
                let prefix = label.toLowerCase().includes("ringer") ? "RNG: " : "SCR: ";
                btn.innerText = prefix + result;
                btn.dataset.value = result;
                btn.classList.add('active');
            }
        }
    };

    window.filterManualTeams = (teamNum) => {
        const tName = document.getElementById('mt'+teamNum).value;
        manualEntryState['mt'+teamNum] = tName;
        
        if(cleanN(tName) === 'bye') {
            const startIdx = teamNum === 1 ? 1 : 4;
            for(let i=startIdx; i<startIdx+3; i++) { 
                manualEntryState['mp'+i] = 'BYE';
                const el = document.getElementById('mp'+i); 
                if(el) { el.innerHTML = `<option value="">BYE</option>`; el.selectedIndex = 0; }
            }
            return;
        }
        const team = (state.roster[mode] || []).find(t => (t.teamName || t.name) === tName);
        const members = team ? (mode === 'DOUBLES' ? team.members : [team]) : [];
        const opts = `<option value="">--Select Player--</option>` + members.map(m => `<option value="${m.name}">${m.name}</option>`).join('') + `<option value="DUMMY">DUMMY</option>`;
        const startIdx = teamNum === 1 ? 1 : 4;
        for(let i=startIdx; i<startIdx+3; i++) { const el = document.getElementById('mp'+i); if(el) el.innerHTML = opts; }
    };
    
    window.updateManualSelection = (key, val) => {
        manualEntryState[key] = val;
    };

    window.openManualFourDeadPicker = async () => {
        const val = await window.smKeypad("Count Four-Deads");
        if(val !== null) document.getElementById('mfdCount').value = val;
    };

    window.submitManualFourDeads = async () => {
        const name = document.getElementById('mfdName').value;
        const count = parseInt(document.getElementById('mfdCount').value);
        if(!name || isNaN(count)) return smAlert("Select name and enter count");
        
        if(!state.fourDeads || Array.isArray(state.fourDeads)) state.fourDeads = { SINGLES: {}, DOUBLES: {} };
        if(!state.fourDeads[mode] || Array.isArray(state.fourDeads[mode])) state.fourDeads[mode] = {};
        
        state.fourDeads[mode][name] = (state.fourDeads[mode][name] || 0) + count;
        await save();
        await smAlert(`Success: ${count} Four-Deads added to ${name}'s stats.`);
        document.getElementById('mfdCount').value = ""; 
        render();
    };

    window.submitManualMatch = async () => {
        // Singles manual entry comes directly from the Lineup and has no team/player selectors.
        // Doubles continues to use the selected team fields.
        const t1 = mode === 'SINGLES'
            ? (manualEntryState.mt1 || manualEntryState.mp1 || '')
            : (document.getElementById('mt1')?.value || manualEntryState.mt1 || '');
        const t2 = mode === 'SINGLES'
            ? (manualEntryState.mt2 || manualEntryState.mp4 || '')
            : (document.getElementById('mt2')?.value || manualEntryState.mt2 || '');
        if(!t1 || !t2) return window.smAlert("Select both teams");
        if(cleanN(t1) === 'bye' && cleanN(t2) === 'bye') return window.smAlert("Both teams cannot be BYE");
        
        const players = [];
        if (mode === 'SINGLES') {
            // Singles has exactly one player on each side. Do not look for mp1/mp4
            // selectors because those controls intentionally do not exist.
            [
                { pIdx: 1, name: manualEntryState.mp1 || t1 },
                { pIdx: 4, name: manualEntryState.mp4 || t2 }
            ].forEach(({pIdx, name}) => {
                players.push({
                    pIdx,
                    name,
                    hcp: getSinglesHcp(name, !!manualEntryState.isPlayoff),
                    g1_scr: manualEntryState[`ms${pIdx}_g1`] !== undefined ? manualEntryState[`ms${pIdx}_g1`] : (document.getElementById(`ms${pIdx}_g1`)?.dataset?.value !== undefined ? Number(document.getElementById(`ms${pIdx}_g1`).dataset.value) : null),
                    g1_rng: manualEntryState[`mr${pIdx}_g1`] !== undefined ? manualEntryState[`mr${pIdx}_g1`] : (document.getElementById(`mr${pIdx}_g1`)?.dataset?.value !== undefined ? Number(document.getElementById(`mr${pIdx}_g1`).dataset.value) : 0),
                    g2_scr: manualEntryState[`ms${pIdx}_g2`] !== undefined ? manualEntryState[`ms${pIdx}_g2`] : (document.getElementById(`ms${pIdx}_g2`)?.dataset?.value !== undefined ? Number(document.getElementById(`ms${pIdx}_g2`).dataset.value) : null),
                    g2_rng: manualEntryState[`mr${pIdx}_g2`] !== undefined ? manualEntryState[`mr${pIdx}_g2`] : (document.getElementById(`mr${pIdx}_g2`)?.dataset?.value !== undefined ? Number(document.getElementById(`mr${pIdx}_g2`).dataset.value) : 0),
                    g3_scr: manualEntryState[`ms${pIdx}_g3`] !== undefined ? manualEntryState[`ms${pIdx}_g3`] : (document.getElementById(`ms${pIdx}_g3`)?.dataset?.value !== undefined ? Number(document.getElementById(`ms${pIdx}_g3`).dataset.value) : null),
                    g3_rng: manualEntryState[`mr${pIdx}_g3`] !== undefined ? manualEntryState[`mr${pIdx}_g3`] : (document.getElementById(`mr${pIdx}_g3`)?.dataset?.value !== undefined ? Number(document.getElementById(`mr${pIdx}_g3`).dataset.value) : 0)
                });
            });
        } else for(let i=1; i<=6; i++) {
            const el = document.getElementById('mp'+i);
            if (!el) continue;
            const n = el.value;
            players.push({ 
                pIdx: i, 
                name: n, 
                hcp: Number(manualEntryState['mh'+i] !== undefined ? manualEntryState['mh'+i] : document.getElementById('mh'+i)?.value || 0), 
                g1_scr: manualEntryState[`ms${i}_g1`] !== undefined ? manualEntryState[`ms${i}_g1`] : (document.getElementById(`ms${i}_g1`)?.dataset?.value !== undefined ? Number(document.getElementById(`ms${i}_g1`).dataset.value) : null), 
                g1_rng: manualEntryState[`mr${i}_g1`] !== undefined ? manualEntryState[`mr${i}_g1`] : (document.getElementById(`mr${i}_g1`)?.dataset?.value !== undefined ? Number(document.getElementById(`mr${i}_g1`).dataset.value) : 0),
                g2_scr: manualEntryState[`ms${i}_g2`] !== undefined ? manualEntryState[`ms${i}_g2`] : (document.getElementById(`ms${i}_g2`)?.dataset?.value !== undefined ? Number(document.getElementById(`ms${i}_g2`).dataset.value) : null), 
                g2_rng: manualEntryState[`mr${i}_g2`] !== undefined ? manualEntryState[`mr${i}_g2`] : (document.getElementById(`mr${i}_g2`)?.dataset?.value !== undefined ? Number(document.getElementById(`mr${i}_g2`).dataset.value) : 0),
                g3_scr: manualEntryState[`ms${i}_g3`] !== undefined ? manualEntryState[`ms${i}_g3`] : (document.getElementById(`ms${i}_g3`)?.dataset?.value !== undefined ? Number(document.getElementById(`ms${i}_g3`).dataset.value) : null), 
                g3_rng: manualEntryState[`mr${i}_g3`] !== undefined ? manualEntryState[`mr${i}_g3`] : (document.getElementById(`mr${i}_g3`)?.dataset?.value !== undefined ? Number(document.getElementById(`mr${i}_g3`).dataset.value) : 0)
            });
        }

        if (mode === 'SINGLES') {
            players.forEach(p => {
                if (!p.name || cleanN(p.name) === 'bye') return;
                p.hcp = getSinglesHcp(p.name, manualEntryState.isPlayoff);
            });
        }

        if (manualEntryState.isPlayoff && !(state.playoffHcpLocked && state.playoffHcpLocked[mode])) return window.smAlert(`Lock the ${mode} playoff handicaps in Manage before entering playoff games.`);
        if (manualEntryState.isPlayoff) players.forEach(p => {
            if (!p.name) return;
            // Regular playoff players use the locked playoff handicap.
            // A DUMMY is the one exception: its handicap is editable for this playoff entry.
            if (cleanN(p.name) !== 'dummy') p.hcp = getPlayoffHcp(p.name);
        });

        const pTally = players.map(p => ({ pIdx: p.pIdx, w: 0, l: 0, t: 0 }));

        const target = mode === 'SINGLES' ? 135 : 162;
        const totalGames = manualEntryState.isPlayoff ? 1 : 3;
        const playoffShoes = manualEntryState.isPlayoff ? Math.max(1, Number(manualEntryState.shoes || document.getElementById('mShoes')?.value || (mode === 'DOUBLES' ? 30 : 50))) : (mode === 'DOUBLES' ? 30 : 50);
        if (manualEntryState.isPlayoff) manualEntryState.shoes = playoffShoes;
        const bonus1 = manualEntryState.isPlayoff ? Number(manualEntryState.bonus1 || document.getElementById('mBonus1')?.value || 0) : 0;
        const bonus2 = manualEntryState.isPlayoff ? Number(manualEntryState.bonus2 || document.getElementById('mBonus2')?.value || 0) : 0;
        const games = []; let agg1 = 0, agg2 = 0;
        const sIdMaster = Date.now();
        const today = new Date().toLocaleDateString();
        
        for(let g=1; g<=totalGames; g++) {
            let t1Scored = players.filter(p => p.pIdx <= 3 && p[`g${g}_scr`] !== null && (manualEntryState.isPlayoff || cleanN(p.name) !== 'dummy'));
            let t2Scored = players.filter(p => p.pIdx > 3 && p[`g${g}_scr`] !== null && (manualEntryState.isPlayoff || cleanN(p.name) !== 'dummy'));

            const t1Dummy = players.find(p => p.pIdx <= 3 && cleanN(p.name) === 'dummy');
            const t2Dummy = players.find(p => p.pIdx > 3 && cleanN(p.name) === 'dummy');

            if (!manualEntryState.isPlayoff && t1Dummy && t1Scored.length < 2 && cleanN(t1) !== 'bye') {
                const dummyItem = { ...t1Dummy, [`g${g}_scr`]: 0, [`g${g}_rng`]: 0 };
                t1Scored.push(dummyItem);
                const orig = players.find(p => p.pIdx === t1Dummy.pIdx);
                if (orig) {
                    orig[`g${g}_scr`] = 0;
                    orig[`g${g}_rng`] = 0;
                }
            }
            if (!manualEntryState.isPlayoff && t2Dummy && t2Scored.length < 2 && cleanN(t2) !== 'bye') {
                const dummyItem = { ...t2Dummy, [`g${g}_scr`]: 0, [`g${g}_rng`]: 0 };
                t2Scored.push(dummyItem);
                const orig = players.find(p => p.pIdx === t2Dummy.pIdx);
                if (orig) {
                    orig[`g${g}_scr`] = 0;
                    orig[`g${g}_rng`] = 0;
                }
            }
            
            if (cleanN(t1) !== 'bye' && t1Scored.length > 2) return window.smAlert(`Game ${g}: Team 1 has more than 2 players scored.`);
            if (cleanN(t2) !== 'bye' && t2Scored.length > 2) return window.smAlert(`Game ${g}: Team 2 has more than 2 players scored.`);

            let hcp1 = t1Scored.reduce((a, b) => a + b.hcp, 0);
            let hcp2 = t2Scored.reduce((a, b) => a + b.hcp, 0);

            let s1Scr = t1Scored.reduce((a, b) => a + (b[`g${g}_scr`] || 0), 0);
            let s2Scr = t2Scored.reduce((a, b) => a + (b[`g${g}_scr`] || 0), 0);
            
            if (!manualEntryState.isPlayoff) {
                t1Scored.forEach(p => { if(cleanN(p.name) === 'dummy') s1Scr += 30; });
                t2Scored.forEach(p => { if(cleanN(p.name) === 'dummy') s2Scr += 30; });
            }

            let s1 = s1Scr + hcp1 + bonus1;
            let s2 = s2Scr + hcp2 + bonus2;
            
            let r1, r2;
            if (cleanN(t2) === 'bye') {
                r1 = s1 >= target ? 'W' : 'L'; r2 = s1 >= target ? 'L' : 'W';
                s2 = target; 
            } else if (cleanN(t1) === 'bye') {
                r2 = s2 >= target ? 'W' : 'L'; r1 = s2 >= target ? 'L' : 'W';
                s1 = target;
            } else {
                r1 = s1 > s2 ? 'W' : (s1 < s2 ? 'L' : 'T');
                r2 = s2 > s1 ? 'W' : (s2 < s1 ? 'L' : 'T');
            }
            agg1 += s1; agg2 += s2;
            
            players.forEach(p => {
                if (p[`g${g}_scr`] !== null && p.name && !['BYE','DUMMY'].includes(cleanN(p.name).toUpperCase())) {
                    const res = p.pIdx <= 3 ? r1 : r2;
                    if(res==='W') pTally[p.pIdx-1].w++;
                    else if(res==='L') pTally[p.pIdx-1].l++;
                    else if(res==='T') pTally[p.pIdx-1].t++;
                }
            });

            games.push({ 
                gameNum: g, s1, s2, h1: hcp1, h2: hcp2, bonus1: manualEntryState.isPlayoff ? bonus1 : 0, bonus2: manualEntryState.isPlayoff ? bonus2 : 0, shoes: playoffShoes, 
                p1: players.find(p=>p.pIdx===1)?.name||'', p1_scr: players.find(p=>p.pIdx===1)?.[`g${g}_scr`]||0, p1_rng: players.find(p=>p.pIdx===1)?.[`g${g}_rng`]||0, 
                p2: players.find(p=>p.pIdx===2)?.name||'', p2_scr: players.find(p=>p.pIdx===2)?.[`g${g}_scr`]||0, p2_rng: players.find(p=>p.pIdx===2)?.[`g${g}_rng`]||0, 
                p3: players.find(p=>p.pIdx===4)?.name||'', p3_scr: players.find(p=>p.pIdx===4)?.[`g${g}_scr`]||0, p3_rng: players.find(p=>p.pIdx===4)?.[`g${g}_rng`]||0, 
                p4: players.find(p=>p.pIdx===5)?.name||'', p4_scr: players.find(p=>p.pIdx===5)?.[`g${g}_scr`]||0, p4_rng: players.find(p=>p.pIdx===5)?.[`g${g}_rng`]||0,
                p5: players.find(p=>p.pIdx===3)?.name||'', p5_scr: players.find(p=>p.pIdx===3)?.[`g${g}_scr`]||0, p5_rng: players.find(p=>p.pIdx===3)?.[`g${g}_rng`]||0,
                p6: players.find(p=>p.pIdx===6)?.name||'', p6_scr: players.find(p=>p.pIdx===6)?.[`g${g}_scr`]||0, p6_rng: players.find(p=>p.pIdx===6)?.[`g${g}_rng`]||0
            });

            players.forEach((p, idx) => { 
                const scr = p[`g${g}_scr`];
                if(scr !== null && cleanN(p.name) !== 'dummy' && cleanN(p.name) !== 'bye' && p.name !== '') {
                    const pAvg = getPlyrAvg(p.name);
                    const hoaValue = scr - pAvg;
                    
                    state.history.push({ 
                        player: p.name, 
                        score: scr, 
                        ringers: p[`g${g}_rng`], 
                        result: p.pIdx<=3?r1:r2, 
                        sessionId: sIdMaster, 
                        gameNum: g, 
                        mode, 
                        date: today, 
                        timestamp: sIdMaster + idx,
                        shoes: playoffShoes,
                        isPlayoff: manualEntryState.isPlayoff
                    }); 
                    
                    const existingIdx = state.weeklyHoa[mode].findIndex(x => x.date === today);
                    if (existingIdx !== -1) {
                        if (hoaValue > state.weeklyHoa[mode][existingIdx].hoa) {
                            state.weeklyHoa[mode][existingIdx] = { date: today, player: p.name, hoa: hoaValue };
                        }
                    } else {
                        state.weeklyHoa[mode].push({ date: today, player: p.name, hoa: hoaValue });
                    }
                }
            });
        }

        let mW;
        if (cleanN(t2) === 'bye') mW = games.filter(g => g.s1 >= target).length > 0 ? t1 : 'BYE';
        else if (cleanN(t1) === 'bye') mW = games.filter(g => g.s2 >= target).length > 0 ? t2 : 'BYE';
        else mW = agg1 > agg2 ? t1 : (agg1 < agg2 ? t2 : 'Tie');

        state.sessions.push({ id: sIdMaster, name: `${manualEntryState.isPlayoff ? '[PLAYOFF] ' : ''}${t1} vs ${t2}`, t1Name: t1, t2Name: t2, date: today, mode, matchWinner: mW, agg1, agg2, fullData: games, isManual: true, timestamp: sIdMaster, isPlayoff: manualEntryState.isPlayoff });
        
        const wasPlayoff = manualEntryState.isPlayoff;
        manualEntryState = { mt1: '', mt2: '', mp1: '', mp2: '', mp3: '', mp4: '', mp5: '', mp6: '', mh1: 0, mh2: 0, mh3: 0, mh4: 0, mh5: 0, mh6: 0, isPlayoff: false, shoes: (mode === 'DOUBLES' ? 30 : 50), bonus1: 0, bonus2: 0 };
        
        await save(); 
        
        const summaryRows = players.filter(p => p.name).map(p => {
            const rec = pTally[p.pIdx-1];
            return `
            <tr class="border-b border-zinc-700 text-[11px]">
                <td class="p-2 text-left font-black uppercase text-sky-400">${p.name || '---'}</td>
                <td class="p-2">${p.g1_scr !== null ? `${p.g1_scr} (${p.g1_rng})` : '-'}</td>
                ${wasPlayoff ? '' : `<td class="p-2">${p.g2_scr !== null ? `${p.g2_scr} (${p.g2_rng})` : '-'}</td>
                <td class="p-2">${p.g3_scr !== null ? `${p.g3_scr} (${p.g3_rng})` : '-'}</td>`}
                <td class="p-2 font-black text-zinc-400">${rec.w}-${rec.l}-${rec.t}</td>
            </tr>
        `}).join('');

        const mod = document.getElementById('modal'); mod.style.display = 'block';
        mod.innerHTML = `
        <div class="p-4 bg-zinc-950 text-white min-h-screen">
            <h2 class="${wasPlayoff ? 'text-red-600' : 'text-sky-500'} font-black italic uppercase text-2xl mb-6 text-center">${wasPlayoff ? 'Playoff Game Confirmation' : 'Manual Match Confirmation'}</h2>
            <div class="bg-zinc-900 border-2 border-zinc-700 p-6 text-center mb-6 shadow-2xl">
                <p class="text-[10px] uppercase opacity-50 mb-2 tracking-[0.2em]">${t1} vs ${t2}</p>
                <p class="text-6xl font-black mb-2">${agg1} - ${agg2}</p>
                <div class="bg-black py-2 px-4 inline-block border border-sky-500/30">
                    <p class="text-sky-400 font-black uppercase text-xs">${wasPlayoff ? "Playoff Winner" : "Series Winner"}: ${mW}</p>

    window.cleanupOrphanedHistory = async () => {
        const sessions = state.sessions || [];
        const validSessionIds = new Set(sessions.map(s => String(s.id)));
        const history = state.history || [];
        const orphaned = history.filter(h => h.sessionId != null && !validSessionIds.has(String(h.sessionId)));
        if (!orphaned.length) {
            await window.smAlert('No orphaned games were found. Stats are already linked to the current History/Session data.');
            return;
        }
        const byMode = {SINGLES:0, DOUBLES:0};
        orphaned.forEach(h => { if(byMode[h.mode] !== undefined) byMode[h.mode]++; });
        const msg = `Found ${orphaned.length} old game record${orphaned.length===1?'':'s'} that no longer belong to an existing session.\n\n`+
            `Singles: ${byMode.SINGLES}\nDoubles: ${byMode.DOUBLES}\n\n`+
            `Remove these orphaned records and rebuild Stats, HOA, and Four Deads?`;
        if(!(await window.smConfirm(msg))) return;

        state.history = history.filter(h => !(h.sessionId != null && !validSessionIds.has(String(h.sessionId))));

        // Rebuild derived regular-season totals from the remaining sessions/history.
        const rebuiltHoa = { SINGLES: [], DOUBLES: [] };
        const rebuiltDeads = { SINGLES: {}, DOUBLES: {} };
        ['SINGLES','DOUBLES'].forEach(md => {
            const remainingHistory = (state.history || []).filter(h => h.mode === md && !h.isNoShow && !h.isTournament && !h.isPlayoff);
            const byDate = {};
            remainingHistory.forEach(h => {
                const avgBefore = getPlyrAvgAtTimestamp(h.player, h.timestamp);
                const hoa = Number(h.score || 0) - Number(avgBefore || 0);
                const dateKey = h.date || new Date(h.timestamp || Date.now()).toLocaleDateString();
                if(!byDate[dateKey] || hoa > byDate[dateKey].hoa) byDate[dateKey] = {date:dateKey, player:h.player, hoa:hoa};
            });
            rebuiltHoa[md] = Object.values(byDate);

            (state.sessions || []).filter(sess => sess.mode === md && !sess.isPlayoff && !sess.isTournament).forEach(sess => {
                (sess.fullData || []).forEach(g => {
                    (g.frames || []).forEach(f => {
                        if(md === 'SINGLES') {
                            if(Number(f.p1)===6 && Number(f.p3)===6) {
                                if(g.p1 && !['bye','dummy'].includes(cleanN(g.p1))) rebuiltDeads[md][g.p1]=(rebuiltDeads[md][g.p1]||0)+1;
                                if(g.p3 && !['bye','dummy'].includes(cleanN(g.p3))) rebuiltDeads[md][g.p3]=(rebuiltDeads[md][g.p3]||0)+1;
                            }
                        } else {
                            const a=['p1','p2'].every(k=>Number(f[k])===6), b=['p3','p4'].every(k=>Number(f[k])===6);
                            if(a) ['p1','p2'].forEach(k=>{const n=g[k];if(n&&!['bye','dummy'].includes(cleanN(n)))rebuiltDeads[md][n]=(rebuiltDeads[md][n]||0)+1;});
                            if(b) ['p3','p4'].forEach(k=>{const n=g[k];if(n&&!['bye','dummy'].includes(cleanN(n)))rebuiltDeads[md][n]=(rebuiltDeads[md][n]||0)+1;});
                        }
                    });
                });
            });
        });
        state.weeklyHoa = rebuiltHoa;
        state.fourDeads = rebuiltDeads;
        await save();
        await window.smAlert(`Removed ${orphaned.length} old game record${orphaned.length===1?'':'s'} and rebuilt Stats.`);
        render();
    };

    window.deleteSession = async (sId) => {
        if(await window.smConfirm("PERMANENTLY DELETE this session? This will remove every game from history and recalculate player stats, HOA, and four-dead totals.")){
            // Remove the session and every history record belonging to it.
            state.sessions = (state.sessions || []).filter(s => s.id !== sId);
            state.history = (state.history || []).filter(h => h.sessionId !== sId);

            // Rebuild derived statistics from the remaining games so deleting a
            // history entry cannot leave stale values behind in Club Stats.
            const rebuiltHoa = { SINGLES: [], DOUBLES: [] };
            const rebuiltDeads = { SINGLES: {}, DOUBLES: {} };

            ['SINGLES','DOUBLES'].forEach(md => {
                const remainingHistory = (state.history || [])
                    .filter(h => h.mode === md && !h.isNoShow && !h.isTournament);

                // Recalculate the best HOA for each date from the games that
                // still exist. Playoff games are intentionally excluded here
                // because Club Stats excludes them from the regular season.
                const byDate = {};
                remainingHistory.forEach(h => {
                    if(h.isPlayoff) return;
                    const avgBefore = getPlyrAvgAtTimestamp(h.player, h.timestamp);
                    const hoa = Number(h.score || 0) - Number(avgBefore || 0);
                    const dateKey = h.date || new Date(h.timestamp || Date.now()).toLocaleDateString();
                    if(!byDate[dateKey] || hoa > byDate[dateKey].hoa) {
                        byDate[dateKey] = { date: dateKey, player: h.player, hoa: hoa };
                    }
                });
                rebuiltHoa[md] = Object.values(byDate);

                // Four-dead totals are derived from the saved game frames.
                (state.sessions || []).filter(sess => sess.mode === md && !sess.isPlayoff && !sess.isTournament).forEach(sess => {
                    (sess.fullData || []).forEach(g => {
                        const frames = g.frames || [];
                        if(md === 'SINGLES') {
                            frames.forEach(f => {
                                if(Number(f.p1) === 6 && Number(f.p3) === 6) {
                                    if(g.p1 && !['bye','dummy'].includes(cleanN(g.p1))) rebuiltDeads[md][g.p1] = (rebuiltDeads[md][g.p1] || 0) + 1;
                                    if(g.p3 && !['bye','dummy'].includes(cleanN(g.p3))) rebuiltDeads[md][g.p3] = (rebuiltDeads[md][g.p3] || 0) + 1;
                                }
                            });
                        } else {
                            frames.forEach(f => {
                                const a = ['p1','p2'].every(k => Number(f[k]) === 6);
                                const b = ['p3','p4'].every(k => Number(f[k]) === 6);
                                if(a) ['p1','p2'].forEach(k => { const n=g[k]; if(n && !['bye','dummy'].includes(cleanN(n))) rebuiltDeads[md][n]=(rebuiltDeads[md][n]||0)+1; });
                                if(b) ['p3','p4'].forEach(k => { const n=g[k]; if(n && !['bye','dummy'].includes(cleanN(n))) rebuiltDeads[md][n]=(rebuiltDeads[md][n]||0)+1; });
                            });
                        }
                    });
                });
            });

            state.weeklyHoa = rebuiltHoa;
            state.fourDeads = rebuiltDeads;
            await save();
            render();
        }
    };

    // End-of-season archive: keep every player/team name, carry the new
    // season starting average forward, and only replace the previous-season
    // high-game ringer percentage when the completed season is higher.
    window.archiveSeason = async () => {
        const pin = await window.smPrompt(`Enter PIN to ARCHIVE ${mode} SEASON:`);
        if(pin !== state.managePin) {
            if(pin !== null) await window.smAlert("Incorrect PIN");
            return;
        }

        if(!(await window.smConfirm(`Archive the ${mode} season? Results and season stats will be cleared, but player/team names will remain.`))) return;

        const roster = mode === 'SINGLES'
            ? (state.roster.SINGLES || [])
            : (state.roster.DOUBLES || []).flatMap(t => t.members || []);
        const seasonHistory = (state.history || []).filter(h => h.mode === mode && !h.isNoShow);

        roster.forEach(player => {
            if(!player || !player.name) return;
            const playerGames = seasonHistory.filter(h => cleanN(h.player) === cleanN(player.name));
            const currentSeasonAvg = playerGames.length
                ? Math.round(playerGames.reduce((sum, g) => sum + Number(g.score || 0), 0) / playerGames.length)
                : Number(player.startAvg || 0);
            const currentSeasonHighRinger = playerGames.length
                ? Math.max(...playerGames.map(g => {
                    const shoes = Number(g.shoes) || (mode === 'DOUBLES' ? 30 : 50);
                    return shoes > 0 ? (Number(g.ringers || 0) / shoes) * 100 : 0;
                }))
                : 0;
            const previousHighRinger = Number(player.prevHighRinger || 0);

            // New starting average is this season's average.
            player.startAvg = currentSeasonAvg;

            // IMPORTANT: never lower the stored previous-season high.
            // Only promote it when this season's high game ringer % is higher.
            if(currentSeasonHighRinger > previousHighRinger) {
                player.prevHighRinger = currentSeasonHighRinger;
            }
        });

        // Clear season data while preserving the roster and player records.
        state.history = state.history.filter(h => h.mode !== mode);
        state.sessions = state.sessions.filter(s => s.mode !== mode);
        state.weeklyHoa[mode] = [];
        state.fourDeads[mode] = {};
        state.activeMatches = state.activeMatches.filter(m => m.mode !== mode);
        if(state.tournament && state.tournament[mode]) state.tournament[mode] = {participants:[],matches:[],activeId:null,complete:false};
        state.winners = { champ: '', runner: '', season: '' };
        state.playoffHcp[mode] = {};
        state.playoffHcpLocked[mode] = false;

        await save();
        location.reload();
    };

    window.editPastGame = async (sId, sGameIdx) => {
        const sess = state.sessions.find(x => x.id === sId); 
        if(!sess) return;
        const g = sess.fullData[sGameIdx];

        const playerKeys = sess.isManual ? ['p1','p2','p5','p3','p4','p6'] : ['p1','p2','p3','p4'];
        
        for (let pk of playerKeys) {
            const pName = g[pk];
            if (!pName || ['bye','dummy'].includes(cleanN(pName))) continue;

            const playedInThisSlot = sess.isManual ? 
                (g[pk + '_scr'] !== null && g[pk + '_scr'] !== undefined) : 
                (g.frames || []).some(f => f[pk] !== null && f[pk] !== undefined);

            if (!playedInThisSlot) continue;

            let curS = sess.isManual ? g[pk + '_scr'] : (g.frames || []).reduce((s,f)=>s+Number(f[pk]||0), 0);
            let curR = sess.isManual ? g[pk + '_rng'] : (g.frames || []).reduce((s,f)=>s+getR(f[pk]), 0);
            
            const resS = await window.smPrompt(`${getFirst(pName)} - New Points:`, curS);
            if(resS === null) continue; 
            
            const resR = await window.smPrompt(`${getFirst(pName)} - New Ringers:`, curR);
            if(resR === null) continue;

            if(sess.isManual) {
                g[pk + '_scr'] = Number(resS);
                g[pk + '_rng'] = Number(resR);
            } else {
                g[pk + '_scr_override'] = Number(resS);
                g[pk + '_rng_override'] = Number(resR);
            }

            const hRec = state.history.find(h => h.sessionId === sId && h.gameNum === g.gameNum && cleanN(h.player) === cleanN(pName));
            if(hRec) {
                hRec.score = Number(resS);
                hRec.ringers = Number(resR);
            }
        }

        const newH1 = await window.smPrompt(`Team 1 Total Handicap for this game:`, g.h1);
        if(newH1 !== null) g.h1 = Number(newH1);
        const newH2 = await window.smPrompt(`Team 2 Total Handicap for this game:`, g.h2);
        if(newH2 !== null) g.h2 = Number(newH2);
        if (sess.isPlayoff) {
            const newB1 = await window.smPrompt(`Team 1 Bonus Points:`, Number(g.bonus1 || 0));
            if(newB1 !== null) g.bonus1 = Number(newB1);
            const newB2 = await window.smPrompt(`Team 2 Bonus Points:`, Number(g.bonus2 || 0));
            if(newB2 !== null) g.bonus2 = Number(newB2);
        }

        const calcTeamScr = (pKeys) => {
            let total = 0;
            pKeys.forEach(k => {
                if(cleanN(g[k]) === 'dummy' || cleanN(g[k]) === 'BYE') {
                    if(cleanN(g[k]) === 'dummy') {
                        // Normal games use the automatic 30-point dummy value.
                        // Playoff manual games use the dummy score entered for that game.
                        if (sess.isPlayoff && sess.isManual) total += Number(g[k + '_scr'] || 0);
                        else total += 30;
                    }
                    return;
                }
                if(sess.isManual) {
                    total += (g[k + '_scr'] || 0);
                } else {
                    total += (g[k + '_scr_override'] !== undefined ? g[k + '_scr_override'] : (g.frames || []).reduce((s,f)=>s+Number(f[k]||0), 0));
                }
            });
            return total;
        };

        const t1Keys = sess.isManual ? ['p1','p2','p5'] : ['p1','p2'];
        const t2Keys = sess.isManual ? ['p3','p4','p6'] : ['p3','p4'];
        
        g.s1 = calcTeamScr(t1Keys) + g.h1 + (sess.isPlayoff ? Number(g.bonus1 || 0) : 0);
        g.s2 = calcTeamScr(t2Keys) + g.h2 + (sess.isPlayoff ? Number(g.bonus2 || 0) : 0);

    function roundRobinBaseSchedule(teams){
        const list=teams.map(t=>({...t})); if(list.length<2)return[];
        if(list.length%2)list.push({name:'BYE',hcp:0,players:[],bye:true});
        const n=list.length,rounds=[]; let arr=list.slice();
        for(let r=0;r<n-1;r++){
            const games=[];
            for(let i=0;i<n/2;i++){
                const a=arr[i],b=arr[n-1-i];
                games.push({court:i+1,a:a.name,b:b.name,aHcp:a.hcp,bHcp:b.hcp,bye:a.name==='BYE'||b.name==='BYE'});
            }

    function roundRobinPairKey(a,b){return[cleanN(a),cleanN(b)].sort().join('|');}
    function roundRobinRealGames(games){return(games||[]).filter(g=>!g.bye&&g.a!=='BYE'&&g.b!=='BYE');}
    function roundRobinRepeatRound(teams,usedCounts,roundNo,previousWeekPairs){
        const remaining=teams.slice(),games=[]; const prev=previousWeekPairs||new Set();
        while(remaining.length>1){
            const a=remaining.shift(); let bi=-1,bs=Infinity;
            for(let i=0;i<remaining.length;i++){
                const b=remaining[i],key=roundRobinPairKey(a.name,b.name),backToBack=prev.has(key)?1:0;
                const score=(backToBack*100000000)+(Number(usedCounts[key]||0)*100000)+Math.abs(Number(a.hcp||0)-Number(b.hcp||0));
                if(score<bs){bs=score;bi=i;}
            }
            if(bi<0)break;
            const b=remaining.splice(bi,1)[0],key=roundRobinPairKey(a.name,b.name); usedCounts[key]=(usedCounts[key]||0)+1;
            games.push({court:games.length+1,a:a.name,b:b.name,aHcp:a.hcp,bHcp:b.hcp});
        }
        return{week:roundNo,title:`${mode==='SINGLES'?'Singles':'Doubles'} Week ${roundNo} — Repeat Matchups`,games,isRepeatRound:true};
    }
    function roundRobinPairingsForRound(teams,usedCounts,previousWeekPairs){
        const pairs=[];
        for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){
            const a=teams[i],b=teams[j],key=roundRobinPairKey(a.name,b.name);
            pairs.push({a,b,key,repeat:Number(usedCounts[key]||0),backToBack:previousWeekPairs&&previousWeekPairs.has(key),diff:Math.abs(Number(a.hcp||0)-Number(b.hcp||0))});
        }
        pairs.sort((x,y)=>(Number(x.backToBack)-Number(y.backToBack))||(x.repeat-y.repeat)||(x.diff-y.diff)||x.a.name.localeCompare(y.a.name)||x.b.name.localeCompare(y.b.name));
        const usedNames=new Set(),games=[];
        for(const p of pairs){if(usedNames.has(p.a.name)||usedNames.has(p.b.name))continue;usedNames.add(p.a.name);usedNames.add(p.b.name);usedCounts[p.key]=(usedCounts[p.key]||0)+1;games.push({court:games.length+1,a:p.a.name,b:p.b.name,aHcp:p.a.hcp,bHcp:p.b.hcp});}
        return games;
    }
    function roundRobinCurrentStandingsOrder(teams){
        const hList=(state.history||[]).filter(h=>h.mode===mode&&!h.isPlayoff&&!h.isTournament&&!h.isNoShow),sessions=(state.sessions||[]).filter(x=>x.mode===mode&&!x.isPlayoff&&!x.isTournament);
        return teams.map(t=>{const names=mode==='DOUBLES'?((state.roster.DOUBLES||[]).find(x=>cleanN(x.teamName||x.name)===cleanN(t.name))?.members||[]).map(m=>cleanN(m.name)):[cleanN(t.name)];const seen=new Set();let w=0,ti=0,l=0;hList.forEach(h=>{if(names.includes(cleanN(h.player))){const k=`${h.sessionId}-${h.gameNum}`;if(!seen.has(k)){seen.add(k);if(h.result==='W')w++;else if(h.result==='T')ti++;else if(h.result==='L')l++;}}});const mp=mode==='DOUBLES'?sessions.filter(x=>cleanN(x.matchWinner)===cleanN(t.name)).length:0;return{...t,w,ti,l,mp,pts:w*2+ti+(mode==='DOUBLES'?mp:0)};}).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.ti-a.ti||a.hcp-b.hcp||a.name.localeCompare(b.name));

    function roundRobinPositionWeek(teams,weekNo,label){

    window.generateRoundRobin=async()=>{
        try{
            const teams=roundRobinTeamData();
            if(teams.length<2)return window.smAlert(`You need at least 2 ${mode==='SINGLES'?'Singles players':'Doubles teams'} to generate a Round Robin.`);
            const cfg=roundRobinCfg();
            const requested=Math.max(1,Math.min(52,Number(document.getElementById('rrWeeks')?.value)||Math.max(1,teams.length-1)));
            const doubleRR=!!document.getElementById('rrDoubleRoundRobin')?.checked;
            const addLast=!!document.getElementById('rrPositionRound')?.checked;
            const addHalf=!!document.getElementById('rrHalfPositionRound')?.checked;
            if(addHalf&&addLast&&requested<3)return window.smAlert('Use at least 3 weeks when adding both a mid-season and final Position Round.');
            const base=roundRobinBaseSchedule(teams),uniqueRounds=base.length,all=[],used={};
            const baseRound=(r,weekNo)=>({...r,week:weekNo,title:`${mode==='SINGLES'?'Singles':'Doubles'} Week ${weekNo}`,games:(r.games||[]).map(g=>({...g}))});
            const markUsed=r=>roundRobinRealGames(r.games).forEach(g=>{const k=roundRobinPairKey(g.a,g.b);used[k]=(used[k]||0)+1;});
            const realCount=teams.length%2?Math.floor(teams.length/2):Math.floor(teams.length/2);

            // First rotation is always the complete unique round robin when there is room.
            // If the season is shorter than one full rotation, keep the most competitive pairings
            // in each week rather than simply using the first few pairings.
            if(requested<uniqueRounds){
                let prevPairs=new Set();
                for(let w=1;w<=requested;w++){
                    const candidates=base.flatMap(r=>roundRobinRealGames(r.games)).filter(g=>!prevPairs.has(roundRobinPairKey(g.a,g.b)));
                    const pool=candidates.map(g=>{const a=teams.find(t=>cleanN(t.name)===cleanN(g.a)),b=teams.find(t=>cleanN(t.name)===cleanN(g.b));return{g,a,b,diff:Math.abs(Number(g.aHcp||0)-Number(g.bHcp||0))};}).sort((x,y)=>x.diff-y.diff);
                    const names=new Set(),games=[];
                    for(const x of pool){if(names.has(x.g.a)||names.has(x.g.b))continue;names.add(x.g.a);names.add(x.g.b);games.push({...x.g,court:games.length+1});if(games.length>=realCount)break;}
                    // Preserve a BYE marker for odd rosters: whichever player is not scheduled gets BYE.
                    if(teams.length%2){const bye=teams.find(t=>!names.has(t.name));if(bye)games.push({court:games.length+1,a:bye.name,b:'BYE',aHcp:bye.hcp,bHcp:0,bye:true});}
                    const rr={week:w,title:`${mode==='SINGLES'?'Singles':'Doubles'} Week ${w}`,games};all.push(rr);markUsed(rr);prevPairs=new Set(roundRobinRealGames(games).map(g=>roundRobinPairKey(g.a,g.b)));
                }
            }else{
                for(let i=0;i<uniqueRounds&&all.length<requested;i++){const rr=baseRound(base[i],all.length+1);all.push(rr);markUsed(rr);}
                if(doubleRR && all.length<requested){
                    const returnCount=Math.min(uniqueRounds,requested-uniqueRounds);
                    // When a full second rotation does not fit, take a suffix of the return rotation.
                    // This makes the final return week line up with the final game/round of rotation one.
                    const start=uniqueRounds-returnCount;
                    let prevPairs=new Set(roundRobinRealGames(all[all.length-1]?.games).map(g=>roundRobinPairKey(g.a,g.b)));
                    for(let i=start;i<uniqueRounds&&all.length<requested;i++){
                        const source=base[i];
                        let games=roundRobinRealGames(source.games).map(g=>({...g}));
                        // The final return round intentionally matches the final round of rotation one,
                        // so it is the one allowed back-to-back exception required to align the rotations.
                        if(i!==uniqueRounds-1) games=games.filter(g=>!prevPairs.has(roundRobinPairKey(g.a,g.b)));
                        if(!games.length) continue;
                        const rr={week:all.length+1,title:`${mode==='SINGLES'?'Singles':'Doubles'} Week ${all.length+1} — Return Round`,games:games.map((g,j)=>({...g,court:j+1})),isRepeatRound:true};
                        all.push(rr);markUsed(rr);prevPairs=new Set(roundRobinRealGames(rr.games).map(g=>roundRobinPairKey(g.a,g.b)));
                    }
                }
                while(all.length<requested){
                    const rr=roundRobinRepeatRound(teams,used,all.length+1,new Set(roundRobinRealGames(all[all.length-1]?.games).map(g=>roundRobinPairKey(g.a,g.b))));
                    all.push(rr);
                }
            }
            if(addHalf){const w=Math.ceil(requested/2);all[w-1]=roundRobinPositionWeek(teams,w,'Mid-Season');}
            if(addLast)all[requested-1]=roundRobinPositionWeek(teams,requested,'Final');
            cfg.weeks=all;cfg.positionRound=addLast;cfg.halfPositionRound=addHalf;cfg.doubleRoundRobin=doubleRR;cfg.requestedWeeks=requested;cfg.updatedAt=Date.now();
            roundRobinStoreLocal(cfg);roundRobinDirty=true;render();
            try{
                if(!firebaseReady||!docRef||!firebaseSetDoc)throw new Error('Cloud connection is not ready.');
                const savePromise=firebaseSetDoc(docRef,{roundRobin:state.roundRobin},{merge:true});
                const result=await Promise.race([savePromise.then(()=>({ok:true})),new Promise(resolve=>setTimeout(()=>resolve({ok:false,timeout:true}),5000))]);
                if(result.ok){roundRobinDirty=false;roundRobinStoreLocal(cfg);render();await window.smAlert(`Round Robin generated for ${requested} weeks with ${teams.length} ${mode==='SINGLES'?'players':'teams'}.`);}
                else await window.smAlert(`Round Robin generated for ${requested} weeks. It is saved on this device; the cloud save is taking longer than expected.`);
            }catch(e){console.error('Round Robin save failed:',e);render();await window.smAlert('Round Robin generated successfully and was kept on this device. The cloud save failed, so check your connection before relying on another device.');}
        }catch(e){console.error('Round Robin generation error:',e);await window.smAlert('Round Robin could not be generated. Please check that at least 2 players/teams are in the current roster. Error: '+(e?.message||e));}
    };
    window.clearRoundRobin=async()=>{
        if(!(await window.smConfirm('Clear the generated Round Robin schedule? This will not delete any scores or history.')))return;
        const c=roundRobinCfg();c.weeks=[];c.positionRound=false;c.halfPositionRound=false;c.requestedWeeks=0;c.updatedAt=Date.now();roundRobinStoreLocal(c);roundRobinDirty=true;
        render();
        try{
            if(!firebaseReady||!docRef||!firebaseSetDoc)throw new Error('Cloud connection is not ready.');
            await Promise.race([firebaseSetDoc(docRef,{roundRobin:state.roundRobin},{merge:true}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Cloud save timeout')),5000))]);
            roundRobinDirty=false;render();
        }catch(e){console.error('Round Robin clear save failed:',e);render();await window.smAlert('The generator was cleared on this device. The cloud save did not complete.');}
    };
