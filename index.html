            </div>
            <div class="patch-box" style="padding:6px;margin-top:10px"><b>Year End Tournament?</b> ${esc(cfg.yearEndTournament)} &nbsp;&nbsp;&nbsp; <b>If Y, # of classes?</b> ${esc(cfg.yearEndClasses)}<br><b>If team play, # of teams?</b> ${esc(cfg.yearEndTeams)} &nbsp;&nbsp;&nbsp; <b># of pitchers per team?</b> ${esc(cfg.yearEndPitchers)}</div>
            <div class="patch-section" style="margin-top:10px"><h3>These patches are to be mailed to:</h3><div style="padding:7px;line-height:1.8"><b>Name:</b> ${esc(cfg.director)}<br><b>Address:</b> ${esc(cfg.address)}<br><b>City, State, Zip:</b> ${esc(cfg.city)}, ${esc(cfg.state)} ____________________<br><b>Phone:</b> ${esc(cfg.phone)}<br><b>Email:</b> ${esc(cfg.email)}</div></div>
            <div class="patch-footer"><b>Percentage patch quantities are calculated from the current Report's High Ringer Game results using the same eligibility rule as the report:</b> a player must reach a higher 10% patch level than their previous highest level. Each eligible player is counted once at the highest new patch level earned. Percentage quantities are filled automatically; enter the other award quantities above in NHPA Form Settings.</div>
            <div style="margin-top:18px;display:flex;justify-content:space-between"><span>Signed: ________________________________</span><span>Club Officer / League Director</span></div>
        </div>`;
        window.executePrint('NHPA Patch Order Form', html, true);
    };

    window.printSanctionSheet = () => {
        const cfg = state.nhpa[mode] || {};
        const shoesPerG = Number(cfg.shoesPerGame) || (mode === 'DOUBLES' ? 30 : 50);
        const rList = mode === 'SINGLES' ? state.roster.SINGLES : state.roster.DOUBLES.flatMap(t => t.members);
        const pNames = rList.map(p => p.name);
        const pData = pNames.map(pN => {
            const g = state.history.filter(h => cleanN(h.player) === cleanN(pN) && h.mode === mode && !h.isNoShow);
            const rRec = rList.find(p => cleanN(p.name) === cleanN(pN)) || {cardNo:'---', category: '---', prevHighRinger: 0};
            const totalPts = g.reduce((s,x)=>s+x.score,0);
            const highPts = g.length ? Math.max(...g.map(x=>x.score)) : 0;
            const totalShoes = g.reduce((sum, x) => sum + (Number(x.shoes) || shoesPerG), 0);
            const totalRingers = g.reduce((s,x)=>s+x.ringers,0);
            const prevHighR = Number(rRec.prevHighRinger || 0);
            const currSeasonHiR = g.length ? Math.max(...g.map(x=>(x.ringers/(Number(x.shoes)||shoesPerG))*100)) : 0;
            const finalRingerPct = totalShoes > 0 ? (totalRingers / totalShoes) * 100 : 0;
            const np = pN.includes(',') ? pN.split(',') : [pN, ''];
            return { last: np[0].trim(), first: np[1]?.trim() || '', div: rRec.category || '---', card: rRec.cardNo || '---', c1: totalPts, c2: highPts, c3: totalShoes, c4: totalRingers, c5: prevHighR.toFixed(1), c6: currSeasonHiR.toFixed(1), c7: finalRingerPct.toFixed(1), elig: Math.floor(currSeasonHiR / 10) > Math.floor(prevHighR / 10) ? 'Y' : '' };
        }).sort((a,b) => a.last.localeCompare(b.last));
        let rows = pData.map(d => `<tr style="text-align:center; font-size: 7.5pt; height: 18px;"><td style="border:1.5px solid black; text-align:left; padding-left:3px;">${d.last}</td><td style="border:1.5px solid black; text-align:left; padding-left:3px;">${d.first}</td><td style="border:1.5px solid black;">${d.div}</td><td style="border:1.5px solid black;">${d.card}</td><td style="border:1.5px solid black; background: #f0f0f0;">${d.c1}</td><td style="border:1.5px solid black;">${d.c2}</td><td style="border:1.5px solid black; background: #f0f0f0;">${d.c3}</td><td style="border:1.5px solid black; background: #f0f0f0;">${d.c4}</td><td style="border:1.5px solid black; background: #f0f0f0;">${d.c5}</td><td style="border:1.5px solid black;">${d.c6}</td><td style="border:1.5px solid black; background: #f0f0f0;">${d.c7}</td><td style="border:1.5px solid black;">${d.elig}</td></tr>`).join('');
        for(let i=0; i<5; i++) rows += `<tr style="height: 18px;"><td style="border:1.5px solid black;" colspan="12"></td></tr>`;
        const html = `<div style="font-family: 'Arial Narrow', Arial, sans-serif; padding: 10px; color: black; background: white; width: 7.5in; margin: auto;"><div style="display:flex; justify-content:center; align-items:center; position: relative; margin-bottom: 5px;"><div style="position: absolute; left: 0; top: 0; width: 60px; height: 60px; border: 1.5 solid black; display: flex; align-items: center; justify-content: center;"><img src="nhpa_logo.png" style="max-width: 50px; max-height: 50px;"></div><div style="text-align:center;"><h1 style="margin:0; font-size:16pt; font-weight:900; font-style:italic;">National Horseshoe Pitchers Association</h1><h2 style="margin:0; font-size:11pt; font-weight:900; text-transform:uppercase;">Sanctioned Club/League Program - FINAL Stat Sheet</h2><p style="margin:0; font-size: 7.5pt;">This form should include all league members. Verify NATSTATS. Scratch scores only.</p><p style="margin:0; font-size: 7.5pt; font-weight: bold;">mail to: Barbara Carson, 7618 Willow Woods Dr., N. Olmsted, OH  Ohio 44070 Bcarson848@gmail.com</p></div></div><div style="border-top: 2.5px solid black; border-bottom: 2.5px solid black; padding: 5px 0; margin-bottom: 10px;"><div style="display: grid; grid-template-columns: 1.5fr 1fr; font-size: 9pt; margin-bottom: 5px;"><div><b>Club Name:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.clubName || ''}</span></div><div><b>Phone#:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.phone || ''}</span></div></div><div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 9pt; margin-bottom: 5px;"><div><b>Sanction Number:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.sanctionNum || ''}</span></div><div><b>Director:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.director || ''}</span></div><div><b>Date Submitted:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.dateSubmitted || ''}</span></div></div><div style="display: grid; grid-template-columns: 0.8fr 1.2fr 1fr; font-size: 9pt; margin-bottom: 5px;"><div><b>State:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.state || ''}</span></div><div><b>Address:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.address || ''}</span></div><div><b>City:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.city || ''}</span></div></div><div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; font-size: 9pt;"><div><b>Dates: Start</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.startDate || ''}</span></div><div><b>End</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.endDate || ''}</span></div><div><b>Cancellation:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.cancellation || ''}</span></div><div><b>Count All:</b> <span style="border-bottom: 1px solid black; padding: 0 10px;">${cfg.countAll || ''}</span></div></div></div><div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 6.5pt; font-weight: bold; margin-bottom: 5px; line-height: 1.1;"><div>Column Number:<br>1. Total League Pts, No Handicap<br>2. High Game Points, No Handicap<br>3. Total League Shoes</div><div><br>4. Total League Ringers<br>5. Previous High Game Ringer %<br>6. Current Season High Game Ringer %</div><div><br>7. Final Ringer %<br>Elig.If higher patch earned indicate with " Y "</div></div><table style="width:100%; border-collapse: collapse; border: 2.5px solid black;"><thead><tr style="font-size: 6.5pt; background: #eee;"><th colspan="2" style="border:1.5px solid black;">Player Name</th><th rowspan="2" style="border:1.5px solid black; width: 30px;">Div.</th><th rowspan="2" style="border:1.5px solid black; width: 60px;">NHPA<br>Card No.</th><th style="border:1.5px solid black;">1</th><th style="border:1.5px solid black;">2</th><th style="border:1.5px solid black;">3</th><th style="border:1.5px solid black;">4</th><th style="border:1.5px solid black;">5</th><th style="border:1.5px solid black;">6</th><th style="border:1.5px solid black;">7</th><th rowspan="2" style="border:1.5px solid black; width: 25px;">Elig</th></tr><tr style="font-size: 5pt; background: #eee;"><th style="border:1.5px solid black; width: 70px;">Last</th><th style="border:1.5px solid black; width: 60px;">First</th><th colspan="7" style="border:1.5px solid black;">NHPA COLUMNS</th></tr></thead><tbody>${rows}</tbody></table><div style="margin-top:10px; font-size: 8pt; font-weight: bold; display: flex; justify-content: space-between; align-items: flex-end;"><div style="width: 60%;">Signed <span style="border-bottom: 2px solid black; display: inline-block; width: 80%;"></span></div><div style="text-align: center; font-size: 6pt; width: 30%;">Club Officer / League Director</div></div></div>`;
        window.executePrint("NHPA Final Stat Sheet", html, true);
    };

    window.addEventListener('resize', () => {
        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
        render();
    });

    // Render the interface first, then connect to Firebase in the background.
    render();
    initFirebase();
</script>
</body>
</html>
